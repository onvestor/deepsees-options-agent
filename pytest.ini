[pytest]
testpaths = tests
# The suite is offline by default. Tests that hit Alpaca are marked `live` and
# deselected here, so `pytest` never depends on the network, a funded account,
# or the market being open. Run them deliberately:
#     pytest -m live
addopts = -m "not live"
markers =
    live: hits the live Alpaca API (read-only; deselected by default)
filterwarnings =
    ignore:websockets.legacy is deprecated:DeprecationWarning
